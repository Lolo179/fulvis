services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fulvis
      POSTGRES_USER: fulvis
      POSTGRES_PASSWORD: fulvis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulvis -d fulvis"]
      interval: 10s
      timeout: 5s
      retries: 5
